<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fomeo TV</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <link rel="stylesheet" href="./assets/css/main.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="./assets/js/latest-video.js" defer></script>
</head>
<body>

  <main class="container">

    <h1>fomeo TV</h1>

    <p class="tagline">
      Medio digital de comunicación con enfoque territorial
      en las provincias de Petorca y Maipo
    </p>

    <div class="socials">

      <a
        href="https://youtube.com/@fomeo_tv"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="YouTube"
      >
        <i class="fa-brands fa-youtube"></i>
      </a>

      <a
        href="https://www.instagram.com/fomeo.tv"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      >
        <i class="fa-brands fa-instagram"></i>
      </a>

      <a
        href="https://www.facebook.com/fomeo.tv/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook"
      >
        <i class="fa-brands fa-facebook-f"></i>
      </a>

    </div>

    <section class="latest-video">
      <h2>Último en fomeo TV</h2>

      <div id="latest-video"></div>
    </section>

  </main>

</body>
</html>
